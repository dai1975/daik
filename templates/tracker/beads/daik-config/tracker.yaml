# Beads data-model selection and scheduler eligibility rules.
tracker:
  # Pack that defines the tracker operation mapping.
  pack: daik.tracker.beads
  # Every required label must be present on a ready bead before dispatch.
  required_labels:
    - "daik:ready"
  # Beads lifecycle states eligible for work and considered terminal.
  active_states:
    - open
  terminal_states:
    - closed
