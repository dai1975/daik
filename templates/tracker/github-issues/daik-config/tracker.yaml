# GitHub Issues settings contributed to the generated daik configuration.

# Issue tracker selection and scheduler eligibility rules.
tracker:
  # Pack that defines the tracker operations in daik-tracker.md.
  pack: daik.tracker.github-issues
  # Executable tracker joint implementing daik.tracker-joint.v1 over stdio.
  # joint:
  #   - daik-joint-github-issues
  joint_timeout_seconds: 30
  # Every required label must be present before an issue can be dispatched.
  required_labels:
    - "daik:ready"
  # Provider-native states eligible for work and considered terminal.
  active_states:
    - open
  terminal_states:
    - closed
